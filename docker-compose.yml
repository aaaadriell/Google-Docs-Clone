services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Google_Docs_Clone_Backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    # For FastAPI/Uvicorn or Flask development with live reload:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: Google_Docs_Clone_Frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_USE_POLLING=true
    volumes:
      - ./frontend:/src
      - /src/node_modules
    # For Vite dev server with host exposure:
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

networks:
  default:
    name: fullstack_network